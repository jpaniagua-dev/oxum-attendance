<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0D0C">
<title>Présences — Bachata Geneva</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell" id="shell" hidden>

  <header class="masthead">
    <div class="masthead-line">
      <p class="eyebrow">Bachata Geneva Dance Studio</p>
      <button class="ghost" id="switch-course" type="button" hidden>Changer de cours</button>
    </div>
    <h1 id="course-title">—</h1>
    <div class="masthead-meta">
      <time id="session-date"></time>
      <span class="tally"><strong id="tally-count">0</strong> <span id="tally-word">présent</span></span>
    </div>
  </header>

  <div class="notice" id="notice" hidden role="status"></div>

  <main id="roster"></main>

  <footer class="footer">
    <div class="footer-state" id="footer-state">Touche ton nom pour signaler ta présence.</div>
    <button class="send" id="send" type="button">Envoyer au studio</button>
  </footer>

</div>

<!-- Course picker, shown only when the day has more than one class. -->
<div class="stage" id="picker" hidden>
  <div class="stage-inner">
    <p class="eyebrow">Bachata Geneva Dance Studio</p>
    <h1>Quel cours ?</h1>
    <p class="stage-note" id="picker-date"></p>
    <div class="picker-list" id="picker-list"></div>
  </div>
</div>

<!-- Loading and failure both live here so the kiosk never shows a blank screen. -->
<div class="stage" id="splash">
  <div class="stage-inner">
    <p class="eyebrow">Bachata Geneva Dance Studio</p>
    <h1 id="splash-title">Présences</h1>
    <p class="stage-note" id="splash-note">Chargement des cours…</p>
    <button class="send" id="splash-retry" type="button" hidden>Réessayer</button>
  </div>
</div>

<!-- Confirmation before writing to the studio's sheet: this is the teacher's action. -->
<div class="stage overlay" id="confirm" hidden>
  <div class="stage-inner">
    <h1>Envoyer les présences ?</h1>
    <p class="stage-note" id="confirm-note"></p>
    <div class="confirm-actions">
      <button class="ghost big" id="confirm-cancel" type="button">Annuler</button>
      <button class="send" id="confirm-send" type="button">Envoyer</button>
    </div>
  </div>
</div>

<!-- Walk-in trial student: name and role, nothing else. -->
<div class="stage overlay" id="walkin" hidden>
  <div class="stage-inner">
    <h1>Cours d'essai</h1>
    <p class="stage-note">Ton prénom et l'initiale de ton nom suffisent.</p>
    <form id="walkin-form" autocomplete="off">
      <label class="field">
        <span>Nom</span>
        <input id="walkin-name" type="text" required maxlength="40" placeholder="Camille B." enterkeyhint="done">
      </label>
      <fieldset class="roles">
        <legend>Je danse en</legend>
        <label><input type="radio" name="walkin-role" value="leader" required><span>Leader</span></label>
        <label><input type="radio" name="walkin-role" value="follower"><span>Follower</span></label>
      </fieldset>
      <p class="field-error" id="walkin-error" hidden></p>
      <div class="confirm-actions">
        <button class="ghost big" id="walkin-cancel" type="button">Annuler</button>
        <button class="send" type="submit">Je suis là</button>
      </div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
