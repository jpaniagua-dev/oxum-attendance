<router-outlet />

@if (store.conflicts().length) {
  <div class="stage" role="alertdialog" aria-labelledby="conflict-title">
    <div class="stage-inner">
      <h1 id="conflict-title">{{ t('conflict.title') }}</h1>
      <p class="note">{{ t('conflict.body') }}</p>
      <ul class="conflicts">
        @for (conflict of store.conflicts(); track conflict) {
          <li>{{ conflict }}</li>
        }
      </ul>
      <div class="actions">
        <button type="button" class="btn btn-primary" (click)="store.dismissConflicts()">
          {{ t('conflict.ok') }}
        </button>
      </div>
    </div>
  </div>
}
